name: Cinder CI

on:
  push:
    branches:
      - main
      - "feat/cinder-agency-operating-roadmap"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build-only placeholders: CI must never connect to a real workspace.
      DATABASE_URL: postgresql://cinder:placeholder@127.0.0.1:5432/cinder
      NEON_AUTH_BASE_URL: https://auth.invalid.example
      NEON_AUTH_COOKIE_SECRET: ci-placeholder-secret-not-used-for-real-auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Regression tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
