name: Code quality

on:
  push:
    branches:
      - feat/crm-foundation
  pull_request:
    branches:
      - main
      - feat/crm-foundation

permissions:
  contents: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-only placeholders; never use these values in a deployed environment.
      DATABASE_URL: "postgresql://build:build@127.0.0.1:5432/build"
      NEON_AUTH_BASE_URL: "https://auth.example.invalid"
      NEON_AUTH_COOKIE_SECRET: "github-actions-only-build-secret-at-least-32-chars"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The committed lockfile predates the current Neon Auth dependency graph.
      # Regenerate it in CI, publish the corrected lockfile for review, then verify
      # that a clean install succeeds against the regenerated lock.
      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
      # One-time repair: commit the regenerated lockfile to this same-repository PR branch.
      - name: Sync regenerated lockfile to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package lockfile with Neon Auth dependencies"
            git push origin "HEAD:${PR_BRANCH}"
          fi
      - name: Install dependencies cleanly
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript
        if: always()
        run: npx tsc --noEmit
      - name: Build Next.js application
        if: always()
        run: npm run build
