name: Code quality

on:
  push:
    branches:
      - feat/crm-foundation
  pull_request:
    branches:
      - main
      - feat/crm-foundation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-only placeholders; never use these values in a deployed environment.
      DATABASE_URL: "postgresql://build:build@127.0.0.1:5432/build"
      NEON_AUTH_BASE_URL: "https://auth.example.invalid"
      NEXT_PUBLIC_NEON_AUTH_URL: "https://auth.example.invalid"
      NEON_AUTH_COOKIE_SECRET: "github-actions-only-build-secret-at-least-32-chars"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The committed lockfile predates the current Neon Auth dependency graph.
      # Regenerate the stale lockfile through a full dependency resolution. The
      # lockfile-only Arborist path has failed in CI before creating node_modules.
      - name: Regenerate dependency lockfile
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Upload regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Install dependencies cleanly
        run: npm ci --legacy-peer-deps
      - name: Run regression tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js application
        run: npm run build
